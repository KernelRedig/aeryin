<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Golden Values</title>
  <link rel="icon" type="image/png" href="assets/images/mainFavicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #06080f;
      --bg-secondary: #0a0c14;
      --gold-primary: #d4af37;
      --gold-secondary: #f4d03f;
      --error-color: #ef4444;
      --success-color: #22c55e;
    }
    body {
      background: var(--bg-primary);
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .grid-bg {
      position: fixed; inset: 0; z-index: -1;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .topbar {
      height: 70px;
      background: rgba(6,8,15,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      position: fixed; top: 0; width: 100%; z-index: 100;
    }
    .topbar a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
    .topbar img { width: 32px; height: 32px; object-fit: contain; }
    .topbar span { font-weight: 800; font-size: 1.2rem; }
    .back-link { color: #9ca3af; text-decoration: none; font-size: 14px; }
    .back-link:hover { color: white; }
    .main-content {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 100px 20px 40px;
    }
    .card {
      background: rgba(10,12,20,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 40px;
      width: 100%; max-width: 440px;
    }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .tab-btn {
      flex: 1; padding: 14px; text-align: center; font-weight: 700; font-size: 14px;
      background: transparent; border: none; color: #6b7280; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all 0.3s;
    }
    .tab-btn.active { background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary)); color: #000; }
    .tab-btn:not(.active):hover { color: white; background: rgba(255,255,255,0.05); }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #9ca3af; }
    .form-group input {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: white; font-size: 16px; font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.3s;
    }
    .form-group input:focus { border-color: var(--gold-primary); }
    .btn-submit {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
      color: #000; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all 0.3s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212,175,55,0.3); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-oauth {
      width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      border: none; cursor: pointer; font-family: 'Inter', sans-serif; color: white; transition: all 0.3s;
    }
    .btn-oauth:hover { transform: translateY(-1px); }
    .btn-discord { background: #5865F2; }
    .btn-discord:hover { background: #4752C4; }
    .btn-google { background: #1f1f1f; border: 1px solid #333; }
    .btn-google:hover { background: #2a2a2a; }
    .divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: #4b5563; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .alert {
      padding: 14px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 14px;
      display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease;
    }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
    .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }
    .switch-text { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
    .switch-text a { color: var(--gold-primary); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <nav class="topbar">
    <a href="index.html">
      <img src="assets/images/mainLogo.png" alt="Logo">
      <span>Golden Values</span>
    </a>
    <a href="index.html" class="back-link"><i class="ph ph-arrow-left"></i> Back</a>
  </nav>

  <main class="main-content">
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
        <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Log In</button>
        <button class="tab-btn" id="tabToken" onclick="switchTab('token')">Token</button>
      </div>

      <div id="alertContainer"></div>

      <button class="btn-oauth btn-discord" onclick="signInWithDiscord()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Continue with Discord
      </button>
      <button class="btn-oauth btn-google" onclick="signInWithGoogle()" style="margin-top: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="divider">or use email</div>

      <!-- Signup Form -->
      <form id="signupForm">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Repeat your password" required minlength="6">
        </div>
        <button type="submit" class="btn-submit" id="signupBtn">Create Account</button>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="hidden">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">Log In</button>
      </form>

      <!-- Token Login Form -->
      <form id="tokenForm" class="hidden">
        <div class="form-group">
          <label for="tokenInput">Recovery Token</label>
          <input type="text" id="tokenInput" placeholder="Enter your recovery token" required>
        </div>
        <button type="submit" class="btn-submit" id="tokenBtn">Verify Token</button>
        <p style="font-size: 12px; color: #6b7280; margin-top: 12px; text-align: center;">
          Found in Profile → Settings → Recovery Token
        </p>
      </form>

      <div class="switch-text" id="switchToLogin">
        Already have an account? <a onclick="switchTab('login')">Log In</a> · <a onclick="switchTab('token')">Use Token</a>
      </div>
      <div class="switch-text hidden" id="switchToSignup">
        Don't have an account? <a onclick="switchTab('signup')">Sign Up</a> · <a onclick="switchTab('token')">Use Token</a>
      </div>
      <div class="switch-text hidden" id="switchToToken">
        Have a password? <a onclick="switchTab('login')">Log In</a> · <a onclick="switchTab('signup')">Sign Up</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://utrahbaolwcnyisxiaft.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0cmFoYmFvbHdjbnlpc3hpYWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjE5MTcsImV4cCI6MjA5MzgzNzkxN30.wYgWsMdNbi91zAEMivzRPo3raQuExiXTjlfTWYfB860';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check if adding another account
    const urlParams = new URLSearchParams(window.location.search);
    const isAddingAccount = urlParams.get('add') === 'true';

    // Only redirect if NOT adding another account
    if (!isAddingAccount) {
      (async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (session) window.location.href = '/index.html';
      })();
    }

    // Build callback URL that works on both Live Server and Vercel
    function getCallbackUrl() {
      const origin = window.location.origin;
      // Live Server needs .html, Vercel (cleanUrls) works without
      if (origin.includes('127.0.0.1') || origin.includes('localhost')) {
        return origin + '/auth/callback.html';
      }
      return origin + '/auth/callback';
    }

    function switchTab(tab) {
      const isSignup = tab === 'signup';
      const isLogin = tab === 'login';
      const isToken = tab === 'token';
      document.getElementById('tabSignup').classList.toggle('active', isSignup);
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabToken').classList.toggle('active', isToken);
      document.getElementById('signupForm').classList.toggle('hidden', !isSignup);
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('tokenForm').classList.toggle('hidden', !isToken);
      document.getElementById('switchToLogin').classList.toggle('hidden', !isSignup);
      document.getElementById('switchToSignup').classList.toggle('hidden', !isLogin);
      document.getElementById('switchToToken').classList.toggle('hidden', !isToken);
      document.getElementById('alertContainer').innerHTML = '';
    }

    async function signInWithDiscord() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'discord',
        options: { redirectTo: getCallbackUrl() }
      });
      if (error) showAlert(error.message, 'error');
    }

    async function signInWithGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: getCallbackUrl() }
      });
      if (error) showAlert(error.message, 'error');
    }

    // Sign Up
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      const btn = document.getElementById('signupBtn');

      if (password !== confirm) { showAlert('Passwords do not match.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Creating...';

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { emailRedirectTo: getCallbackUrl() }
      });

      if (error) {
        showAlert(translateError(error.message), 'error');
      } else if (data.user && data.user.identities && data.user.identities.length === 0) {
        showAlert('This email is already registered. Try logging in.', 'error');
      } else if (data.session) {
        showAlert('Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = '/index.html'; }, 1500);
        return;
      } else {
        showAlert('Account created! Check your email to confirm.', 'success');
      }

      btn.disabled = false;
      btn.textContent = 'Create Account';
    });

    // Log In
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showAlert(translateError(error.message), 'error');
        btn.disabled = false;
        btn.textContent = 'Log In';
      } else {
        showAlert('Logged in! Redirecting...', 'success');
        setTimeout(() => { window.location.href = '/index.html'; }, 1200);
      }
    });

    // Token Login
    document.getElementById('tokenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('tokenInput').value.trim();
      const btn = document.getElementById('tokenBtn');

      if (!token || token.length < 10) {
        showAlert('Please enter a valid token.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/auth/token-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Invalid token', 'error');
        } else {
          showAlert(`<i class="ph ph-check-circle"></i> Token verified! A login link has been sent to ${data.email}`, 'success');
          document.getElementById('tokenInput').value = '';
        }
      } catch (err) {
        showAlert('Failed to verify token. Try again.', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Verify Token';
    });

    function showAlert(message, type) {
      const icon = type === 'error' ? '<i class="ph ph-x-circle"></i>' : '<i class="ph ph-check-circle"></i>';
      document.getElementById('alertContainer').innerHTML =
        `<div class="alert alert-${type}"><strong>${icon}</strong> ${message}</div>`;
      if (type === 'success') setTimeout(() => { document.getElementById('alertContainer').innerHTML = ''; }, 6000);
    }

    function translateError(msg) {
      const map = {
        'Invalid login credentials': 'Invalid email or password.',
        'Email not confirmed': 'Please confirm your email before logging in.',
        'User already registered': 'This email is already registered.',
        'Password should be at least 6 characters': 'Password must be at least 6 characters.',
        'Unable to validate email address: invalid format': 'Invalid email format.',
        'Signup requires a valid password': 'Please enter a valid password.',
      };
      return map[msg] || msg;
    }

    if (new URLSearchParams(window.location.search).get('tab') === 'login') switchTab('login');
  </script>
  <script src="/assets/js/security.js"></script>
</body>
</html>
