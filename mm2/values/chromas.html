<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chromas Value List - Golden Values</title>
  <link rel="icon" type="image/png" href="/assets/images/faviconmm2.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* BARRA DE ROLAGEM CUSTOMIZADA (Tema Chroma) */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #06080f; }
    ::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

    body { background-color: #06080f; background-image: linear-gradient(rgba(6, 8, 15, 0.90), rgba(6, 8, 15, 0.95)), url('/assets/images/mm2weapons.webp'); background-size: cover; background-attachment: fixed; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    .grid-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
    
    .topbar { height: 70px; background: rgba(6, 8, 15, 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: fixed; top: 0; width: 100%; z-index: 1000; transition: transform 0.3s ease; }
    
    .item-wrapper { position: relative; border-radius: 12px; overflow: hidden; background: linear-gradient(rgba(10, 12, 20, 0.95) 0%, rgba(0, 208, 218, 0.10) 100%); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
    
    /* Efeito Tilt/Hover */
    .item-wrapper:hover { transform: translateY(-5px) scale(1.03); z-index: 20; border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(0, 208, 218, 0.2); }
    
    /* Borda animada Chroma original adaptada */
    .rainbow-border { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #d90000, #e0da32, #01d803, #00d0da, #3e0fd6, #dc06e0, #d90000); background-size: 200% auto; animation: gradientAnim 2s linear infinite; }
    @keyframes gradientAnim { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    
    /* Skeleton Loader Animação */
    @keyframes pulse-bg { 0%, 100% { background-color: rgba(255,255,255,0.05); } 50% { background-color: rgba(255,255,255,0.1); } }
    .skeleton { animation: pulse-bg 1.5s infinite; border-radius: 8px; }

    /* Entrada Animada */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in-up { animation: fadeInUp 0.5s ease forwards; opacity: 0; }

    /* =========================================
       LAYOUT DE LISTA
       ========================================= */
    .list-view { display: flex !important; flex-direction: column !important; gap: 12px !important; }
    .list-view .item-wrapper { flex-direction: row !important; height: 80px !important; padding: 0 20px !important; }
    .list-view .card-content { flex-direction: row !important; justify-content: space-between !important; align-items: center !important; }
    .list-view .img-container { width: 60px !important; height: 60px !important; margin-bottom: 0 !important; flex-shrink: 0; }
    .list-view .item-name { margin-bottom: 0 !important; text-align: left !important; width: auto !important; flex-grow: 1; padding-left: 20px; font-size: 1.1rem !important; }
    .list-view .badge-wrapper { padding-bottom: 0 !important; margin-top: 0 !important; margin-right: 24px; flex-shrink: 0; }
    .list-view .price-wrapper { border-top: none !important; padding-top: 0 !important; width: auto !important; gap: 16px !important; flex-shrink: 0; }
    /* Adaptação da borda Chroma para a vista de lista (fica na vertical) */
    .list-view .rainbow-border { width: 3px; height: 100%; bottom: 0; left: 0; top: 0; background: linear-gradient(180deg, #d90000, #e0da32, #01d803, #00d0da, #3e0fd6, #dc06e0, #d90000); background-size: auto 200%; animation: gradientVerticalAnim 2s linear infinite; }
    @keyframes gradientVerticalAnim { 0% { background-position: center 0%; } 100% { background-position: center 200%; } }
    /* ========================================= */
    
    /* Toast */
    #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999; }
    #toast.show { bottom: 30px; }

    /* Bater coração */
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .heart { display: inline-block; color: #ef4444; animation: heartbeat 1.5s infinite; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div id="scrollProgress" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-red-500 via-yellow-400 to-purple-500 z-[1001] w-0"></div>

  <nav class="topbar" id="navbar">
    <div class="flex items-center gap-8">
      <a href="../../index.html" class="flex items-center gap-3 text-white no-underline hover:opacity-80">
        <img src="/assets/images/mainLogo.png" alt="Logo" class="w-8 h-8 object-contain">
        <span class="font-extrabold text-xl tracking-tight hidden sm:block">Golden Values</span>
      </a>
      <div class="hidden lg:flex text-gray-500 text-xs font-medium tracking-widest uppercase">
        <a href="../../index.html" class="hover:text-white transition">Home</a> <span class="mx-2">></span>
        <span>Values</span> <span class="mx-2">></span>
        <span class="text-white">Chromas</span>
      </div>
    </div>
    
    <div class="hidden md:flex items-center gap-6 font-semibold text-sm">
      <a href="ancients.html" class="text-gray-400 hover:text-white transition-colors">Ancients</a>
      <a href="chromas.html" class="bg-clip-text text-transparent bg-gradient-to-r from-red-400 via-green-400 to-blue-400 font-bold drop-shadow-[0_0_8px_rgba(255,255,255,0.3)] border-b-2 border-white pb-1">Chromas</a>
      <a href="vintages.html" class="text-gray-400 hover:text-white transition-colors">Vintages</a>
      <a href="evos.html" class="text-gray-400 hover:text-white transition-colors">Evos</a>
      <a href="godlies.html" class="text-gray-400 hover:text-white transition-colors">Godlies</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-5 w-full flex-1">
    <div class="text-center mb-8 mt-4">
        <h1 id="typewriterTitle" class="text-4xl md:text-5xl font-extrabold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-red-500 via-yellow-500 to-purple-500 drop-shadow-md min-h-[60px]"></h1>
        <p class="text-[#8b8d98] text-lg">Current trading values and demands for all Chroma tier items.</p>
    </div>

    <div class="w-full flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-[#0a0c14]/80 p-4 rounded-2xl border border-white/5 backdrop-blur-md">
      
      <div class="relative w-full md:w-1/2 group">
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search Chromas (Press / to focus)" class="w-full bg-black/50 border border-white/10 text-white rounded-full py-2.5 pl-11 pr-10 focus:outline-none focus:border-white transition-all text-sm">
        <button id="clearBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white hidden">✖</button>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto justify-between">
        <span id="resultCount" class="text-sm font-bold text-gray-400 w-24">0 weapons</span>

        <div class="flex gap-2">
          <select id="sortSelect" class="bg-black/50 border border-white/10 text-white text-sm rounded-lg px-3 py-2 outline-none focus:border-white cursor-pointer appearance-none">
            <option value="high">Price: High to Low</option>
            <option value="low">Price: Low to High</option>
            <option value="az">Name: A to Z</option>
          </select>

          <button id="gridBtn" class="bg-white/10 text-white p-2 rounded-lg border border-white/30 hover:bg-white/20 transition">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          </button>
          <button id="listBtn" class="bg-black/50 text-gray-400 p-2 rounded-lg border border-white/10 hover:text-white transition">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="noResults" class="hidden text-center text-gray-400 text-lg w-full mb-10">No weapons found matching your search.</div>

    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5 pb-20" id="itemGrid">
       <div class="item-wrapper h-[210px] p-3 flex flex-col justify-between"><div class="skeleton h-20 w-full"></div><div class="skeleton h-4 w-3/4 mx-auto"></div><div class="skeleton h-6 w-1/2 mx-auto"></div></div>
       <div class="item-wrapper h-[210px] p-3 flex flex-col justify-between"><div class="skeleton h-20 w-full"></div><div class="skeleton h-4 w-3/4 mx-auto"></div><div class="skeleton h-6 w-1/2 mx-auto"></div></div>
       <div class="item-wrapper h-[210px] p-3 flex flex-col justify-between hidden md:flex"><div class="skeleton h-20 w-full"></div><div class="skeleton h-4 w-3/4 mx-auto"></div><div class="skeleton h-6 w-1/2 mx-auto"></div></div>
       <div class="item-wrapper h-[210px] p-3 flex flex-col justify-between hidden lg:flex"><div class="skeleton h-20 w-full"></div><div class="skeleton h-4 w-3/4 mx-auto"></div><div class="skeleton h-6 w-1/2 mx-auto"></div></div>
    </div>
  </main>

  <footer class="w-full py-6 text-gray-500 text-sm border-t border-white/5 mt-auto bg-black/40">
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
      <p>&copy; 2024 Golden Values. Feito com <span class="heart">❤</span> por Golden Values.</p>
    </div>
  </footer>

  <div id="toast">Value Copied!</div>

  <button id="scrollTopBtn" class="fixed bottom-6 right-6 text-white p-3 rounded-full shadow-[0_0_20px_rgba(255,255,255,0.4)] opacity-0 pointer-events-none transition-all duration-300 z-50 translate-y-10" style="background: linear-gradient(135deg, #d90000, #e0da32, #01d803, #00d0da, #3e0fd6, #dc06e0);">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
  </button>

  <script>
    // ESTADO E VARIÁVEIS GLOBAIS
    let armasDados = [];
    // A tua badge Chroma original
    const badgeHtml = `<div class="inline-flex rounded-xl bg-opacity-50 p-px" style="background: conic-gradient(rgb(217, 0, 0), rgb(224, 218, 50), rgb(1, 216, 3), rgb(0, 208, 218), rgb(62, 15, 214), rgb(220, 6, 224), rgb(217, 0, 0));"><div class="relative max-w-fit min-w-min inline-flex items-center justify-between box-border whitespace-nowrap px-1 h-6 text-[10px] font-bold rounded-full text-white bg-[#0B0F17]/90"><span class="flex-1 text-inherit px-1">CHROMA</span></div></div>`;

    function formatVal(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    function getTrendIcon(trend) {
      if (trend === 'Rising') return '<span class="text-green-400 text-xs ml-1" title="Rising">⬆️</span>';
      if (trend === 'Dropping') return '<span class="text-red-400 text-xs ml-1" title="Dropping">⬇️</span>';
      return '<span class="text-gray-500 text-xs ml-1" title="Stable">➖</span>';
    }

    function toRobux(val) { 
      const v = typeof val === 'string' ? parseInt(val.replace(/[^0-9]/g, '')) || 0 : val; 
      return Math.round(v * 1.68); 
    }
    function formatRobux(val) {
      const r = toRobux(val);
      if (r >= 1000000) return (r / 1000000).toFixed(1) + 'M';
      if (r >= 1000) return (r / 1000).toFixed(1) + 'K';
      return r.toString();
    }

    function formatMoney(val) {
      if (val >= 1000000) return (val / 1000000).toFixed(2) + 'M';
      if (val >= 1000) return (val / 1000).toFixed(1) + 'K';
      return val.toFixed(2);
    }

    function toMoney(val) {
      const curr = detectCurrency();
      const v = typeof val === 'string' ? parseInt(val.replace(/[^0-9]/g, '')) || 0 : val;
      return (v * curr.rate);
    }

    function detectCurrency() {
      const currencyMap = {
        'BR': { symbol: 'R$', rate: 0.0896, label: 'BRL' },
        'US': { symbol: '$', rate: 0.018, label: 'USD' },
        'CA': { symbol: '$', rate: 0.018, label: 'USD' },
        'GB': { symbol: '£', rate: 0.014, label: 'GBP' },
        'DE': { symbol: '€', rate: 0.0165, label: 'EUR' },
        'FR': { symbol: '€', rate: 0.0165, label: 'EUR' },
        'ES': { symbol: '€', rate: 0.0165, label: 'EUR' },
        'IT': { symbol: '€', rate: 0.0165, label: 'EUR' },
        'NL': { symbol: '€', rate: 0.0165, label: 'EUR' },
        'JP': { symbol: '¥', rate: 2.65, label: 'JPY' },
        'AU': { symbol: '$', rate: 0.027, label: 'AUD' }
      };
      const userLang = navigator.language || navigator.userLanguage || 'en';
      const country = userLang.split('-')[1] || userLang.split('_')[1];
      return currencyMap[country] || { symbol: '$', rate: 0.018, label: 'USD' };
    }

    window.copyValue = function(e, name, value) {
      e.stopPropagation();
      navigator.clipboard.writeText(`${name}: ${value}`).then(() => {
        const toast = document.getElementById('toast');
        toast.innerText = `Copied ${name} value: ${value}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    };

    window.toggleDetails = function (idStr) { const container = document.getElementById(`details-${idStr}`); if (container.classList.contains('hidden')) { container.classList.remove('hidden'); container.classList.add('flex'); } else { container.classList.add('hidden'); container.classList.remove('flex'); } }

    // RENDERIZAR AS ARMAS
    function renderizarArmas(armas) {
      const grid = document.getElementById('itemGrid');
      const count = document.getElementById('resultCount');
      grid.innerHTML = '';
      count.innerText = `${armas.length} weapons`;

      if (armas.length === 0) return;

      armas.forEach((item, index) => {
        const valorExato = item.value.base.toLocaleString('en-US');
        const trendIcon = getTrendIcon(item.value.trend);
        const delay = index * 0.05; 

        const div = document.createElement('div');
        div.className = `item-wrapper flex flex-col items-center p-4 relative fade-in-up bg-black/40`;
        div.style.animationDelay = `${delay}s`;
        
div.innerHTML = `
          <div class="card-content flex flex-col h-full w-full items-center">
            
            <div class="img-container h-24 w-full flex items-center justify-center mb-3">
              <img src="${item.image}" alt="${item.name}" class="max-h-full max-w-[90%] object-contain drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)]" onerror="this.src='/assets/images/fallback-image.png'">
            </div>
            
            <div class="text-base font-bold text-white mb-2 text-center w-full truncate item-name">${item.name}</div>
            
            <div class="badge-wrapper mt-auto pb-3">${badgeHtml}</div>
              
            <div class="price-wrapper w-full flex flex-col gap-2 border-t border-white/10 pt-3">
              <div class="flex items-center justify-center gap-4">
                <div class="flex items-center gap-1 cursor-pointer hover:bg-white/5 p-2 rounded-md transition" onclick="toggleDetails('${item.name.replace(/[^a-zA-Z0-9]/g, '')}')">
                  <img src="/assets/images/faviconmm2.png" class="w-4 h-4" alt="Value"><span class="text-sm font-extrabold text-white">${formatVal(item.value.base)}</span>
                  ${trendIcon}
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <button onclick="copyValue(event, '${item.name}', '${valorExato}')" class="text-gray-500 hover:text-white transition bg-white/5 p-1.5 rounded-md" title="Copy Value">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
              </div>
              <div id="details-${item.name.replace(/[^a-zA-Z0-9]/g, '')}" class="hidden flex-col gap-2 w-full mt-2 pt-2 border-t border-white/10">
                <div class="flex items-center justify-between bg-red-500/10 p-2 rounded border border-red-500/30">
                  <div class="flex items-center gap-2"><img src="/assets/images/faviconmm2.png" class="w-5 h-5" alt="Robux"><span class="text-red-400 font-bold">Robux:</span></div>
                  <span class="text-white font-bold">${formatRobux(item.value.base)} R$</span>
                </div>
                <div class="flex items-center justify-between bg-green-500/10 p-2 rounded border border-green-500/30">
                  <div class="flex items-center gap-2"><svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.336 2.82.904M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.336 2.82.904M12 8c1.657 0 3 .895 3 2s-1.343 2-3 2"></path></svg><span class="text-green-400 font-bold">Money:</span></div>
                  <span class="text-white font-bold">${detectCurrency().symbol}${formatMoney(toMoney(item.value.base))}</span>
                </div>
              </div>
            </div>
            
          </div>
          <div class="rainbow-border"></div>
        `;
        grid.appendChild(div);
      });
    }

    async function loadItems() {
      try {
        const res = await fetch('/data/chromas-values.json');
        const data = await res.json();
        armasDados = data.items ? data.items.filter(i => i.rarity && i.rarity.toLowerCase() === 'chroma') : [];
        armasDados.sort((a, b) => b.value.base - a.value.base);
        setTimeout(() => { renderizarArmas(armasDados); }, 500);
      } catch (e) {
        document.getElementById('itemGrid').innerHTML = "<p class='text-red-400 text-center col-span-full'>Erro ao carregar dados.</p>";
      }
    }

    function configurarEventos() {
      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearBtn');
      const sortSelect = document.getElementById('sortSelect');
      const gridBtn = document.getElementById('gridBtn');
      const listBtn = document.getElementById('listBtn');
      const itemGrid = document.getElementById('itemGrid');
      const noResults = document.getElementById('noResults');

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        clearBtn.style.display = query.length > 0 ? 'block' : 'none';
        const filtradas = armasDados.filter(item => item.name.toLowerCase().includes(query));
        renderizarArmas(filtradas);
        if (filtradas.length === 0) noResults.classList.remove('hidden');
        else noResults.classList.add('hidden');
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        renderizarArmas(armasDados);
        noResults.classList.add('hidden');
        searchInput.focus();
      });

      sortSelect.addEventListener('change', (e) => {
        let sorted = [...armasDados];
        if(e.target.value === 'high') sorted.sort((a,b) => b.value.base - a.value.base);
        if(e.target.value === 'low') sorted.sort((a,b) => a.value.base - b.value.base);
        if(e.target.value === 'az') sorted.sort((a,b) => a.name.localeCompare(b.name));
        const query = searchInput.value.toLowerCase();
        if(query) sorted = sorted.filter(item => item.name.toLowerCase().includes(query));
        renderizarArmas(sorted);
      });

      gridBtn.addEventListener('click', () => {
        itemGrid.classList.remove('list-view');
        itemGrid.classList.add('grid', 'grid-cols-2', 'md:grid-cols-4', 'lg:grid-cols-5');
        gridBtn.classList.replace('text-gray-400', 'text-white');
        gridBtn.classList.replace('bg-black/50', 'bg-white/10');
        gridBtn.style.borderColor = 'rgba(255, 255, 255, 0.3)';
        listBtn.classList.replace('text-white', 'text-gray-400');
        listBtn.classList.replace('bg-white/10', 'bg-black/50');
        listBtn.style.borderColor = 'rgba(255,255,255,0.1)';
      });

      listBtn.addEventListener('click', () => {
        itemGrid.classList.add('list-view');
        itemGrid.classList.remove('grid', 'grid-cols-2', 'md:grid-cols-4', 'lg:grid-cols-5');
        listBtn.classList.replace('text-gray-400', 'text-white');
        listBtn.classList.replace('bg-black/50', 'bg-white/10');
        listBtn.style.borderColor = 'rgba(255, 255, 255, 0.3)';
        gridBtn.classList.replace('text-white', 'text-gray-400');
        gridBtn.classList.replace('bg-white/10', 'bg-black/50');
        gridBtn.style.borderColor = 'rgba(255,255,255,0.1)';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
        }
      });
    }

    function configurarEfeitosGlobais() {
      const scrollProgress = document.getElementById('scrollProgress');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      const navbar = document.getElementById('navbar');
      let lastScrollY = window.scrollY;

      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        
        const scrolled = (scrollTop / docHeight) * 100;
        scrollProgress.style.width = scrolled + '%';

        if (scrollTop > lastScrollY && scrollTop > 100) {
           navbar.style.transform = 'translateY(-100%)';
        } else {
           navbar.style.transform = 'translateY(0)';
        }
        lastScrollY = scrollTop;

        if (scrollTop > 300) {
            scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
        } else {
            scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
        }
      });

      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      const titulo = "Chroma Weapons";
      const elementoTitulo = document.getElementById('typewriterTitle');
      let i = 0;
      function digitar() {
        if (i < titulo.length) {
          elementoTitulo.innerHTML += titulo.charAt(i);
          i++;
          setTimeout(digitar, 100);
        }
      }
      setTimeout(digitar, 300);
    }

    window.onload = () => {
      loadItems();
      configurarEventos();
      configurarEfeitosGlobais();
    };
  </script>
  <script src="/assets/js/watchlist-heart.js"></script>
  <script src="/assets/js/security.js"></script>
</body>
</html>
