<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying - Golden Values</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      background-color: #06080f; 
      color: #ffffff; 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .loader {
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #d4af37;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: #9ca3af; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h1>Verifying your account...</h1>
  <p>Please wait while we verify your Roblox account.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    if (error) {
      document.body.innerHTML = `
        <h1>Verification Failed</h1>
        <p>Error: ${error}</p>
        <a href="/create-account.html" class="text-yellow-500 hover:text-yellow-400 mt-4 inline-block">Try Again</a>
      `;
    } else if (code && state) {
      const stateMatch = sessionStorage.getItem('oauth_state');
      const username = sessionStorage.getItem('oauth_username');
      const userId = sessionStorage.getItem('oauth_userId');

      if (stateMatch === state && username) {
        fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, username, userId, state })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            window.location.href = '/@' + username + '?verified=true';
          } else {
            document.body.innerHTML = `
              <h1>Verification Failed</h1>
              <p>${data.error || 'Unknown error occurred'}</p>
              <a href="/create-account.html" class="text-yellow-500 hover:text-yellow-400 mt-4 inline-block">Try Again</a>
            `;
          }
        })
        .catch(err => {
          document.body.innerHTML = `
            <h1>Verification Failed</h1>
            <p>Network error. Please try again.</p>
            <a href="/create-account.html" class="text-yellow-500 hover:text-yellow-400 mt-4 inline-block">Try Again</a>
          `;
        });
      } else {
        document.body.innerHTML = `
          <h1>Verification Failed</h1>
          <p>Invalid state. Please try again.</p>
          <a href="/create-account.html" class="text-yellow-500 hover:text-yellow-400 mt-4 inline-block">Try Again</a>
        `;
      }
    } else {
      window.location.href = '/create-account.html';
    }
  </script>
  <script src="/assets/js/security.js"></script>
</body>
</html>
