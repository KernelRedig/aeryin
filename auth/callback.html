<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating... - Golden Values</title>
  <link rel="icon" type="image/png" href="/assets/images/mainFavicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #06080f;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: rgba(10,12,20,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 40px;
      width: 100%; max-width: 400px; text-align: center;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { color: #9ca3af; font-size: 14px; }
    .btn {
      display: inline-block; margin-top: 20px; padding: 14px 28px;
      background: linear-gradient(135deg, #d4af37, #f4d03f);
      color: #000; border-radius: 12px; font-weight: 700;
      text-decoration: none; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <h1>Authenticating...</h1>
    <p>Please wait while we verify your account.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://utrahbaolwcnyisxiaft.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0cmFoYmFvbHdjbnlpc3hpYWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjE5MTcsImV4cCI6MjA5MzgzNzkxN30.wYgWsMdNbi91zAEMivzRPo3raQuExiXTjlfTWYfB860';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleCallback() {
      const card = document.getElementById('card');

      try {
        // Supabase picks up tokens from URL hash automatically
        const { data: { session }, error } = await sb.auth.getSession();

        if (error) throw error;

        if (session) {
          const user = session.user;

          // Get profile for accurate username/avatar
          let profile = null;
          try {
            const { data: p } = await sb.from('profiles').select('username,avatar_url').eq('id', user.id).single();
            profile = p;
          } catch (e) {}

          // Save profile to DB
          await sb.from('profiles').upsert({
            id: user.id,
            email: user.email,
            username: profile?.username || user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'User',
            avatar_url: profile?.avatar_url || user.user_metadata?.avatar_url || null,
            provider: user.app_metadata?.provider || 'email'
          }, { onConflict: 'id' });

          // Add to accounts list (multi-account support)
          const ACCOUNTS_KEY = 'gv_accounts';
          const CURRENT_ACCOUNT_KEY = 'gv_current_account';
          try {
            const accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || [];
            const existingIndex = accounts.findIndex(a => a.id === user.id);
            const accountData = {
              id: user.id,
              email: user.email,
              name: profile?.username || user.user_metadata?.full_name || user.email?.split('@')[0] || 'User',
              avatar: profile?.avatar_url || user.user_metadata?.avatar_url || null,
              provider: user.app_metadata?.provider || 'email',
              lastLogin: new Date().toISOString()
            };
            if (existingIndex >= 0) {
              accounts[existingIndex] = { ...accounts[existingIndex], ...accountData, lastLogin: new Date().toISOString() };
            } else {
              accounts.push(accountData);
            }
            localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
            localStorage.setItem(CURRENT_ACCOUNT_KEY, JSON.stringify(accountData));
          } catch (e) { console.error('Failed to save account:', e); }

          // Store locally
          localStorage.setItem('gv_user', JSON.stringify({
            id: user.id,
            email: user.email,
            username: profile?.username || user.user_metadata?.full_name || user.email?.split('@')[0],
            avatar_url: profile?.avatar_url || user.user_metadata?.avatar_url || null
          }));

          // Check if switching accounts
          const params = new URLSearchParams(window.location.search);
          if (params.get('switch')) {
            window.location.href = '/index.html';
            return;
          }

          card.innerHTML = `
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" style="margin: 0 auto 16px; display: block;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <h1>Login successful!</h1>
            <p>Redirecting...</p>
          `;
          setTimeout(() => { window.location.href = '/index.html'; }, 1500);
          return;
        }

        // Try PKCE code exchange
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) {
          const { data, error: exchangeError } = await sb.auth.exchangeCodeForSession(params.get('code'));
          if (exchangeError) throw exchangeError;
          if (data.session) {
            handleCallback();
            return;
          }
        }

        throw new Error('No session found');

      } catch (err) {
        console.error('Callback error:', err);
        card.innerHTML = `
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" style="margin: 0 auto 16px; display: block;">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <h1 style="color: #ef4444;">Authentication Error</h1>
          <p>${err.message || 'Please try again.'}</p>
          <a href="/create-account.html" class="btn">Try Again</a>
        `;
      }
    }

    handleCallback();
  </script>
  <script src="/assets/js/security.js"></script>
</body>
</html>
